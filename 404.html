<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quenesi/404</title>
    <link rel="icon" href="иконка.png" sizes="any">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&display=swap" rel="stylesheet">
<style>
body {
    background-color: #121212;
    color: #ffffff;
    font-family: "LXGW WenKai TC", cursive;
    font-weight: 400;
    font-style: normal;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    text-align: center;
}
h1 { color: #f55555; font-size: 10.5rem; }
p { color: #888; font-size: 3.2rem; }
a {
    color: #ffffff;
    text-decoration: none;
    transition: all 0.2s ease-in-out;
}

a:visited {
    color: #d3d3d3;
}

a:hover {
    color: #ff7ebc;
    text-decoration: underline;
}

</style>
</head>
<body>

    <h1>404</h1>
    <p>A где мой сайтик :(</p>
    <p><a href="index.html">перейти на главную</a></p>
    <img src="сайт в разроботке/qaz.png" alt="Описание картинки" height="300">

    <script>
fetch('https://allorigins.win' + encodeURIComponent('https://www.anekdot.ru/rss/random.html'))
  .then(response => {
    if (response.ok) return response.json();
    throw new Error('Ошибка сети.');
  })
  .then(data => {
    // Декодируем и очищаем HTML от лишних тегов, чтобы достать текст анекдота
    const parser = new DOMParser();
    const doc = parser.parseFromString(data.contents, 'text/html');

    // Находим блок с текстом анекдота на странице anekdot.ru
    const jokeElement = doc.querySelector('.topicbox .text');

    if (jokeElement) {
      const jokeText = jokeElement.innerText.trim();

      // Вот здесь ваш console.log выводит результат в консоль!
      console.log("%cАнекдот дня:", "color: #007BFF; font-weight: bold; font-size: 14px;");
      console.log(jokeText);
    } else {
      console.log("Не удалось найти текст анекдота на странице.");
    }
  })
  .catch(error => console.error('Ошибка загрузки анекдота:', error));


    </script>
</body>
</html>
