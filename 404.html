<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quenesi/404</title>
    <link rel="icon" href="иконка.png" sizes="any">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&display=swap" rel="stylesheet">
<style>
body {
    background-color: #121212;
    color: #ffffff;
    font-family: "LXGW WenKai TC", cursive;
    font-weight: 400;
    font-style: normal;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    text-align: center;
}
h1 { color: #f55555; font-size: 10.5rem; }
p { color: #888; font-size: 3.2rem; }
a {
    color: #ffffff;
    text-decoration: none;
    transition: all 0.2s ease-in-out;
}

a:visited {
    color: #d3d3d3;
}

a:hover {
    color: #ff7ebc;
    text-decoration: underline;
}

</style>
</head>
<body>

    <h1>404</h1>
    <p>A где мой сайтик :(</p>
    <p><a href="index.html">перейти на главную</a></p>
    <img src="сайт в разроботке/qaz.png" alt="Описание картинки" height="300">


<script>
    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const now = new Date();
    const audio = document.getElementById('dscnhtk');

    if (now.getDate() === 3 && now.getMonth() === 8) {
        const threshold = 160;

        setInterval(async () => {
            const widthThreshold = window.outerWidth - window.innerWidth > threshold;
            const heightThreshold = window.outerHeight - window.innerHeight > threshold;

            if (widthThreshold || heightThreshold) {
                console.log("Я календарь переверну");
                await sleep(1000);
                console.log("И снова");
                await sleep(1000);
                console.log("Never gonna give you up");
                await sleep(1000);
                console.log("Say goodbye");
                await sleep(1000);
                console.log("*Звук выстрела*");

                if (audio) {
                    await audio.play().catch(err => {
                        console.log("Браузер заблокировал звук, так как не было клика по странице");
                    });
                }
            }
        }, 1000);
    }
    // 2. В JS пишется "else if", а не "elif"
    else if (now.getDate() === 1 && now.getMonth() === 4) {
        console.log("Анекдотов сегодня не будет");
    }
    else {
        fetch('https://allorigins.win' + encodeURIComponent('https://www.anekdot.ru/rss/random.html'))
          .then(response => {
            if (response.ok) return response.json();
            throw new Error('Ошибка сети.');
          })
          .then(data => {
            const parser = new DOMParser();
            const doc = parser.parseFromString(data.contents, 'text/xml');

            const items = doc.querySelectorAll('item');
            if (items.length > 0) {
              const randomItem = items[Math.floor(Math.random() * items.length)];
              const description = randomItem.querySelector('description');

              if (description) {
                const jokeText = description.textContent.replace(/<br\s*\/?>/gi, '\n').trim();

                console.log("%cАнекдот дня:", "color: #007BFF; font-weight: bold; font-size: 14px;");
                console.log(jokeText);
              }
            } else {
              console.log("Не удалось найти анекдоты в RSS-ленте.");
            }
          })
          .catch(error => console.error('Ошибка загрузки анекдота:', error));
    }
</script>

</body>
</html>
