<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Godot Проект</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            background: radial-gradient(circle, #ffffff 0%, #FFF3E6 100%);
        }

        /* Сетка: 4 колонки по 150px и теперь 3 строки по 150px */
        .container {
            display: grid;
            grid-template-columns: repeat(4, 150px);
            grid-template-rows: repeat(3, 150px);
            gap: 20px;
            align-items: center;
            justify-content: center;
        }

        .card {
            position: relative;
            width: 150px;
            height: 150px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            background: #fff;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 0.3s ease;
        }

        .card img.hover-img {
            opacity: 0;
        }

        .card:hover img.hover-img {
            opacity: 1;
        }

        /* Центральный блок Godot (занимает 2х2 вверху по центру) */
        .center-project {
            grid-column: 2 / 4;
            grid-row: 1 / 3;
            width: 320px;
            height: 320px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background: #232733;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .center-project iframe, .center-project img {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="card" style="grid-column: 1; grid-row: 1;">
            <img src="https://picsum.photos/150/150?random=1" alt="Обычная 1">
            <img src="https://picsum.photos/150/150?random=11" alt="При наведении 1" class="hover-img">
        </div>

        <div class="card" style="grid-column: 1; grid-row: 2;">
            <img src="https://picsum.photos/150/150?random=2" alt="Обычная 2">
            <img src="https://picsum.photos/150/150?random=12" alt="При наведении 2" class="hover-img">
        </div>

        <div class="center-project">
            <img src="https://picsum.photos/320/320?random=99" alt="Godot Проект">
        </div>

        <div class="card" style="grid-column: 4; grid-row: 1;">
            <img src="https://picsum.photos/150/150?random=3" alt="Обычная 3">
            <img src="https://picsum.photos/150/150?random=13" alt="При наведении 3" class="hover-img">
        </div>

        <div class="card" style="grid-column: 4; grid-row: 2;">
            <img src="https://picsum.photos/150/150?random=4" alt="Обычная 4">
            <img src="https://picsum.photos/150/150?random=14" alt="При наведении 4" class="hover-img">
        </div>

        <div class="card" style="grid-column: 2; grid-row: 3;">
            <img src="https://picsum.photos/150/150?random=5" alt="Обычная 5">
            <img src="https://picsum.photos/150/150?random=15" alt="При наведении 5" class="hover-img">
        </div>

        <div class="card" style="grid-column: 3; grid-row: 3;">
            <img src="https://picsum.photos/150/150?random=6" alt="Обычная 6">
            <img src="https://picsum.photos/150/150?random=16" alt="При наведении 6" class="hover-img">
        </div>

    </div>

</body>
</html>
