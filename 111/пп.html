<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>quenesi.tk</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="иконка.png" sizes="any">
        <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Lucida Grande", "Lucida Sans Unicode", Arial, Helvetica, sans-serif;
        }





        h2 {
            font-size: 22px;
            font-weight: bold;
            color: #1e395b;
            text-shadow: 1px 1px 0px #ffffff;
            margin-bottom: 20px;
            border-bottom: 1px dashed #bcccda;
            padding-bottom: 10px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }





        .btn:hover {
            background: #4f98d6;
            background: linear-gradient(to bottom, #77b5e9 0%, #4084bd 50%, #3474a5 51%, #276292 100%);
        }

        .btn:active {
            background: #255d8c;
            box-shadow: inset 0px 2px 5px rgba(0, 0, 0, 0.5);
            padding-top: 11px;
            padding-bottom: 9px;
        }


        .footer-text a {
            color: #1f537e;
            text-weight: bold;
            text-decoration: underline;
        }

        .footer-text a:hover {
            color: #e47911;
        }
    </style>
</head>
<body>

<div class="reg-container">
    <h2>Создать аккаунт</h2>
    <form action="#" method="POST">
        <div class="form-group">
            <label for="username">Имя пользователя</label>
            <input type="text" id="username" name="username" required placeholder="Иван">
        </div>

        <div class="form-group">
            <label for="email">Электронная почта</label>
            <input type="email" id="email" name="email" required placeholder="example@mail.com">
        </div>

        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" required placeholder="Мин. 8 символов">
        </div>

        <button type="submit" class="btn">Зарегистрироваться</button>
    </form>


</div>

</body>
</html>
